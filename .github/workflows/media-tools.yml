name: Build media tools
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm make pkg-config zip
      - name: Build from pinned source
        run: bash scripts/media-build/build.sh
      - name: Upload verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/media-build/draft.mjs
