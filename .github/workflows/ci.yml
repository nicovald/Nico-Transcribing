name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install system media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch pinned Windows tools
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/install-media-tools.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        if: runner.os == 'Linux'
        run: docker build -t transcriber-ci .
      - name: Verify desktop notices
        if: runner.os == 'Windows'
        run: npm run legal
      - name: Desktop smoke check
        if: runner.os == 'Windows'
        run: node scripts/desktop-smoke.mjs
